name: Owner Core1 + PB1 + IP46 + Naxx292 + Services16 Worldserver (DRAFT, OFF)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'conf/**'
      - 'tests/**'
      - '.github/workflows/character-services-core-dualfile-ip43-naxx291-joint-native-20261103.yml'
  push:
    paths:
      - 'src/**'
      - 'conf/**'
      - '.github/workflows/character-services-core-dualfile-ip43-naxx291-joint-native-20261103.yml'

permissions:
  contents: read

jobs:
  pinned-paid-vendor-worldserver-link:
    name: Owner Core paid + PB earned reset + IP46 + Naxx292 + Services (NO LAUNCH)
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Checkout owner Core fork draft #1 (raw malformed-receipt protection committed)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/azerothcore-wotlk
          ref: 1e37f3343cf08618101b625601cd299f0a1770ca
          path: acore
          persist-credentials: false
      - name: Checkout owner Playerbots fork draft #1 (earned RNDBOT reset protection OFF)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-playerbots
          ref: 0cf8163d8bda15c765f73538667fc49d9a9ceb46
          path: acore/modules/mod-playerbots
          persist-credentials: false
      - name: Checkout latest IP #46 paid hand-in protection and protected receipt (default OFF)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 26d5b7a1de30ad92a595aaf251fc14754cf54f32
          path: acore/modules/mod-individual-progression
          persist-credentials: false
      - name: Checkout Naxx #292 P1-P4/P4-H + Hunter ammo/quiver + F15 path redaction
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: 51d0611476358286505aed3ca806ea250f644f66
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Checkout exact Character Services development PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-character-services
          persist-credentials: false
      - name: Assert all exact pins, owner snapshots, disabled defaults and IP API
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C acore rev-parse HEAD)" = 1e37f3343cf08618101b625601cd299f0a1770ca
          test "$(git -C acore/modules/mod-playerbots rev-parse HEAD)" = 0cf8163d8bda15c765f73538667fc49d9a9ceb46
          test "$(git -C acore/modules/mod-individual-progression rev-parse HEAD)" = 26d5b7a1de30ad92a595aaf251fc14754cf54f32
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD)" = 51d0611476358286505aed3ca806ea250f644f66
          test "$(git -C acore/modules/mod-character-services rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cs=acore/modules/mod-character-services
          ip=acore/modules/mod-individual-progression
          pb=acore/modules/mod-playerbots
          grep -Fqx 'Playerbots.ResetQuestsPreserveQuestIds =' "$pb/conf/playerbots.conf.dist"
          test -s "$pb/tests/test_f14_earned_marker_reset_source.py"
          grep -Fq 'preserveMask != 0 && sRandomPlayerbotMgr.IsRandomBot(bot)' "$pb/src/Bot/Factory/PlayerbotFactory.cpp"
          grep -Fq 'ResetQuestsPreserveMask.store(markerMask, std::memory_order_release)' "$pb/src/PlayerbotAIConfig.cpp"
          grep -Fqx 'CharacterServices.ExpansionUnlock.Enable = 0' "$cs/conf/character_services.conf.dist"
          grep -Fqx 'IndividualProgression.PaidExpansion.Enable = 0' "$ip/conf/individualProgression.conf.dist"
          grep -Fq 'PurchaseExpansion(Player* player' "$ip/src/IndividualProgression.h"
          grep -Fq 'GetAccountEffectiveProgression(uint32 accountId)' "$ip/src/IndividualProgression.h"
          grep -Fq 'GetAccountEffectiveProgression(uint32 accountId)' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'AccountProgressionForTierService(' "$cs/src/CharacterServices.cpp"
          grep -Fqx '#define COSMIC_IP_PAID_EXPANSION_API_VERSION 1' "$ip/src/IndividualProgression.h"
          grep -Fq 'player->GetQuestStatus(INTO_THE_BREACH) == QUEST_STATUS_COMPLETE' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'player->IncompleteQuest(INTO_THE_BREACH);' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'MustHoldPaidTbcQuestReward(player)' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'CMSG_QUESTGIVER_CHOOSE_REWARD' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'new IndividualProgression_PaidTbcQuestRewardPacketGuard();' "$ip/src/IndividualProgressionExpansion.cpp"
          # CS01-IP #46 strict receipt integrity: all eight canonical slots
          # must be written before one character SaveToDB, no new paid mode.
          grep -Fq 'for (uint32 slot = 0; slot < ReceiptPolicy::Slots; ++slot)' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'stagedLedger.fields[slot]' "$ip/src/IndividualProgressionExpansion.cpp"
          # Latest IP #46 same-session grandfather receipt fix (source-only pin).
          grep -Fq 'index < ReceiptPolicy::Slots' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'receipt->second.fields[index] = value;' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'Your quest and TBC purchase are preserved.' "$ip/src/IndividualProgressionExpansion.cpp"
          test -s "$ip/tests/paid_receipt_full_slot_model.cpp"
          test -s "$ip/tests/test_ip_paid_expansion_source.py"
          test -f "$ip/tests/test_ip_paid_tbc_disabled_progression_sale.py"
          grep -Fq 'F15 RAW ARCHIVE REFUSED' "acore/modules/mod-naxxramas-core/scripts/f15_raw_archive.py"
          grep -Fq 'player->GetQuestStatus(INTO_THE_BREACH) == QUEST_STATUS_REWARDED' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'PurchaseExpansion(' "$cs/src/CharacterServices.cpp"
          grep -Fq 'CharacterServicesGatePolicy::CanOfferGenericTier(' "$cs/src/CharacterServices.cpp"
          grep -Fqx 'NaxxramasCore.MasterLootQuestGive.Enabled = 0' "acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist"
          grep -Fqx 'NaxxramasCore.QuestLootPickupAuthorization.Enabled = 0' "acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist"
          grep -Fqx 'NaxxramasCore.QuestLootSparkleGuard.Enabled = 0' "acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist"
          # Combined #292 includes owner-approved P2 legal vendor fallback,
          # rare Doomshot allotment and Molten Core equipped quiver draft.
          # Every new opt-in remains OFF in the distributed config.
          grep -Fqx 'NaxxramasCore.BotConsumables.HunterAmmo.Enabled = 0' "acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist"
          grep -Fqx 'NaxxramasCore.BotConsumables.HunterAmmo.AllowSelectedNonVendor = 0' "acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist"
          grep -Fqx 'NaxxramasCore.BotConsumables.HunterAmmo.AllowOneDoomshotAllocation = 0' "acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist"
          grep -Fqx 'NaxxramasCore.BotConsumables.HunterAmmo.MoltenCore.FillQuiver.Enabled = 0' "acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist"
          test -s acore/modules/mod-naxxramas-core/src/Systems/HunterAmmoProvision.cpp
          test -s acore/modules/mod-naxxramas-core/tests/test_hunter_ammo_consumables.py

          grep -Fqx 'NaxxramasCore.WarlockRitual.SecondStagePilot.Enabled = 0' "acore/modules/mod-naxxramas-core/conf/mod_naxxramas_core.conf.dist"
          grep -Fq 'AddMasterLootQuestGiveScripts();' "acore/modules/mod-naxxramas-core/src/NaxxramasCore_loader.cpp"
          test -f "acore/modules/mod-naxxramas-core/src/Systems/MasterLootQuestGive.cpp"
          # Both previous development streams are composed without changing
          # paid flags or granting a tier. Verify the specific reviewed blobs.
          test "$(git -C "$ip" rev-parse HEAD:src/cs_individualProgression.cpp)" = 278aaa48dc5fb7770bd6013e659e4872752d4b03
          test "$(git -C acore/modules/mod-naxxramas-core rev-parse HEAD:src/Systems/MasterLootQuestGive.h)" = dc1b9c1d53bfc6405187efb06a5425e4ffd9fd91
          # Require the F14/F19 fix, P3 raw copy-only archive and strict OFF
          # defaults from the newly integrated development source.
          test "$(git -C "$ip" rev-parse HEAD:src/IndividualProgressionF14LoginPolicy.h)" = 1322be33a2cd306445fb94f5759b4151fe705a99
          grep -Fqx 'IndividualProgression.F14.PreserveVerifiedRandomBotStageOnLogin = 0' "$ip/conf/individualProgression.conf.dist"
          # Integrated IP #46 adds an independent skip-only RandomBot group
          # safeguard. This is incomplete F14 and MUST remain opt-in/OFF.
          grep -Fqx 'IndividualProgression.F14.ProtectVerifiedRandomBotGroupFloor = 0' "$ip/conf/individualProgression.conf.dist"
          grep -Fq 'ShouldSkipF14VerifiedRandomBotGroupDowngrade(' "$ip/src/IndividualProgression.cpp"
          grep -Fq 'ShouldSkipF14VerifiedRandomBotGroupDowngrade(player, leaderState)' "$ip/src/IndividualProgressionPlayer.cpp"
          test -s "$ip/tests/f14_group_sync_floor.cpp"
          test -s "$ip/tests/test_ip_f14_group_floor_source.py"
          test "$(git -C "$ip" rev-parse HEAD:tests/test_ip_paid_expansion_source.py)" = c17425404bfcc942811f362910da5d83b7d62429
          test -s acore/modules/mod-naxxramas-core/scripts/f15_raw_archive.py
          test -s acore/modules/mod-naxxramas-core/tests/test_f15_raw_archive.py
          test -s acore/modules/mod-naxxramas-core/tests/test_f15_supervised_retention.py
          test -s acore/modules/mod-naxxramas-core/scripts/f15_retention_preview.py
          test -s acore/modules/mod-naxxramas-core/scripts/f15_supervised_storage_audit.py
          # Verify the newer child draws protected bodies from the same base,
          # rather than accidentally dropping prior Naxx Hunter/P4/P3 work.
          test -s acore/modules/mod-naxxramas-core/src/Systems/QuestLootSparkleGuard.cpp
          test -s acore/modules/mod-naxxramas-core/src/Systems/QuestLootProtection.cpp
          # Preserve actual H1 pickup while omitting denied H2 quest sparkle.
          test -s acore/modules/mod-naxxramas-core/src/Systems/QuestLootTurnGuard.h
          grep -Fq 'WouldDenyQuestSlotForViewer' acore/modules/mod-naxxramas-core/src/Systems/QuestLootProtection.cpp
          grep -Fq 'WouldDenyQuestSlotForViewer' acore/modules/mod-naxxramas-core/src/Systems/QuestLootSparkleGuard.cpp
          grep -Fq 's_pickupTurnEnabled.load' acore/modules/mod-naxxramas-core/src/Systems/QuestLootSparkleGuard.cpp
          grep -Fq 'TURN.visible_normal_roll_keeps_B_sparkle' acore/modules/mod-naxxramas-core/tests/p4_h2_sparkle/sparkle_harness.cpp
          test -s acore/modules/mod-naxxramas-core/scripts/f15_supervised_retention.py
          test -z "$(sed -n '99p' "$cs/src/CharacterServices.cpp")"
          test -s "$cs/docs/source-snapshots/CharacterServices-owner-20261101.cpp"
          test -s "$cs/docs/source-snapshots/character_services-owner-20261101.conf.dist"
          echo 'PASS: pinned source / OFF switches / separate historical owner snapshots'
      - name: Run merged IP #46 partial F14 default-OFF source and portable floor tests (NO HOST)
        shell: bash
        run: |
          set -euo pipefail
          ip=acore/modules/mod-individual-progression
          python3 -B -m unittest discover -s "$ip/tests" -p 'test_ip_f14_group_floor_source.py' -v
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 "$ip/tests/f14_group_sync_floor.cpp" -o /tmp/ip-f14-group-floor
          /tmp/ip-f14-group-floor | tee /tmp/ip-f14-floor.out
          grep -Fq 'F14 GROUP FLOOR MODEL 1805/1805 passed' /tmp/ip-f14-floor.out
      - name: Verify paid raw-receipt protection ALREADY COMMITTED in owner Core fork (NO PATCH)
        shell: bash
        run: |
          set -euo pipefail
          core=acore
          ip=$core/modules/mod-individual-progression
          target=src/server/game/Entities/Player/PlayerSettings.cpp
          player=src/server/game/Entities/Player/Player.h
          test "$(git -C "$core" rev-parse HEAD)" = 1e37f3343cf08618101b625601cd299f0a1770ca
          test "$(git -C "$core" rev-parse "HEAD:$target")" = 2bcac6abe4a8960a62241a582d86ba28e46b2719
          test "$(git -C "$core" rev-parse "HEAD:$player")" = 81920131574af4a00e6d0f213c428b25750d9aa0
          test -z "$(git -C "$core" status --porcelain)"
          grep -Fq 'SerializeSettingsData(parsed) == data' "$core/$target"
          grep -Fq 'if (!PlayerSettingsStore::IsCanonicalPaidReceiptRow(source, data))' "$core/$target"
          grep -Fq 'if (unsafePaidRow)' "$core/$target"
          grep -Fq 'm_preserveMalformedPaidSettingsRow' "$core/$target"
          grep -Fq 'bool m_preserveMalformedPaidSettingsRow = false;' "$core/$player"
          grep -Fq 'ReceiptPolicy::DecodeRaw' "$ip/src/IndividualProgressionExpansion.cpp"
          grep -Fq 'player->IsBeingTeleportedFar()' "$ip/src/IndividualProgressionExpansion.cpp"
          python3 -B -m unittest discover -s "$core/tests/cosmic_paid_receipt_guard" -p 'test_paid_receipt_guard_source.py' -v
          echo 'PASS: exact two-file raw-paid Core guard committed in owner fork; no runner patch, no DB writes'

      - name: Apply exactly two pinned Playerbots compatibility edits ON CI RUNNER ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('acore/modules/mod-playerbots')
          edits={
            'src/Db/PlayerbotsDatabase.h': (
              'MySQLConnection* CreateAsyncConnection(ProducerConsumerQueue<SQLOperation*>* queue,',
              'MySQLConnection* CreateConnection(ProducerConsumerQueue<SQLOperation*>* queue,'),
            'src/Util/LocaleColumns.h':(
              'if (!IsLocaleRegistered(locale))','if (!localeNames[locale])')
          }
          for name,(old,new) in edits.items():
            f=root/name
            s=f.read_text()
            assert s.count(old)==1 and new not in s,name
            f.write_text(s.replace(old,new))
          PY
          git -C acore/modules/mod-playerbots diff --check
          git -C acore/modules/mod-playerbots diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' 'src/Db/PlayerbotsDatabase.h' 'src/Util/LocaleColumns.h' | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/actual.txt
      - name: Install compile dependencies on disposable runner only
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ make pkg-config file \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev
      - name: Generate pinned static module compile database (NO SERVER START)
        run: |
          cmake -S acore -B acore-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="-DCOSMIC_IP_F14_REQUIRE_PLAYERBOTS" \
            -DMODULES=static -DSCRIPTS=static \
            -DAPPS_BUILD=world-only -DTOOLS_BUILD=none \
            -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Assert all three actual module C++ compilation units are in graph
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cc=json.loads(Path('acore-build/compile_commands.json').read_text())
          for module,file in [
            ('mod-individual-progression','IndividualProgressionExpansion.cpp'),
            ('mod-character-services','CharacterServices.cpp'),
            ('mod-naxxramas-core','Systems/MasterLootQuestGive.cpp')
          ]:
            hits=[entry for entry in cc
                  if entry.get('file','').replace('\\','/').endswith('/'+module+'/src/'+file)]
            assert len(hits)==1,(module,file,len(hits))
            print('PASS: real compilation unit present',module,file)
          PY
      - name: Compile AND link actual combined Worldserver (do not execute)
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify finished binary without launching it
        run: |
          test -s acore-build/src/server/apps/worldserver
          test -x acore-build/src/server/apps/worldserver
          echo 'PASS: OWNER Core DRAFT #1 + OWNER PB DRAFT #1 (OFF) + IP #46 + Naxx #292 + Services #16 Worldserver LINKED; Core paid row guard COMMITTED, not runner-applied'
          echo 'No owner host, accounts, DB, NPC, gold, config, enablement or live archive touched'
      - name: Safety and confidence boundary
        if: always()
        run: |
          echo 'Only two pre-existing Playerbots CI-only compatibility edits remain disposable on runner. They are NOT owner-fork PR source or installed branch proof.'
          echo 'Even a successful native link is NOT a completed gossip/payment/restart/gameplay test.'
          echo 'Both expansion feature flags remain OFF; do not deploy without CosmicCuddle approval.'
