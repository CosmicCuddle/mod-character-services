name: Character Services Core25 + PB19 + IP168 + WPS + public AutoBalance native gate
on:
  push:
    branches:
      - ci/cs01-core25-pb19-ip168-wps-autobalance-native-20261112
    paths:
      - '.github/workflows/character-services-core25-pb19-ip168-wps-autobalance-native-20261112.yml'
  pull_request:
    branches:
      - ci/cs01-core23-ip168-wps-autobalance-native-20261112
    paths:
      - '.github/workflows/character-services-core25-pb19-ip168-wps-autobalance-native-20261112.yml'
permissions:
  contents: read
jobs:
  worldserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - name: Checkout exact Core25 Grim-upstream restack candidate
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/azerothcore-wotlk
          ref: 395b68ee4ce425826c2a79c0ddf3ade3c67c8160
          path: acore
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact PB19 current-upstream restack candidate
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-playerbots
          ref: 92e7b539c249e91a4046e0b6ce0dbc6d39783284
          path: acore/modules/mod-playerbots
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact IP168 rights-refresh performance correction
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-individual-progression
          ref: 455597329f2578c634091b8c3a79d83b31181d40
          path: acore/modules/mod-individual-progression
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact Naxx292
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/Mod-Naxxramas-Core
          ref: 51d0611476358286505aed3ca806ea250f644f66
          path: acore/modules/mod-naxxramas-core
          persist-credentials: false
      - name: Checkout merged World Party Scaling
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/mod-world-party-scaling
          ref: 36ad573c0ee22e24abf3f48b6e40c4bc360ec8e8
          path: acore/modules/mod-world-party-scaling
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned public AutoBalance reference
        uses: actions/checkout@v4
        with:
          repository: azerothcore/mod-autobalance
          ref: 1d707cb61a0962ab01e4123681e2d3b66cc558a2
          path: acore/modules/mod-autobalance
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout this Services CI-only child
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: acore/modules/mod-character-services
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Core25 + PB19 + IP168 + WPS + AutoBalance restack tuple
        shell: bash
        run: |
          set -euo pipefail
          core=acore
          ip=acore/modules/mod-individual-progression
          pb=acore/modules/mod-playerbots
          naxx=acore/modules/mod-naxxramas-core
          cs=acore/modules/mod-character-services
          wps=acore/modules/mod-world-party-scaling
          ab=acore/modules/mod-autobalance

          core_upstream=afd7036bab385e96a2c540272680cc0ec2f7dd4d
          core23=dbb1dd5150f330d88522a10b85e93546fff72bad
          core_restack=395b68ee4ce425826c2a79c0ddf3ade3c67c8160
          pb_upstream=405f81196161017eebae3ee7a612d786a3ed2a9d
          pb15=4b355ea3a8fd00a0b116681bf9db4c7a3eb0e051
          pb_runtime=468f5880e32db408be80ce2851b2803dd55b71bc
          pb_head=92e7b539c249e91a4046e0b6ce0dbc6d39783284
          ip168=455597329f2578c634091b8c3a79d83b31181d40
          services70=bd211576aa04f2bfc520bf5c31dd6e8e6572254d

          test "$(git -C "$core" rev-parse HEAD)" = "$core_restack"
          test "$(git -C "$core" rev-parse HEAD^1)" = "$core_upstream"
          test "$(git -C "$core" rev-parse HEAD^2)" = "$core23"
          git -C "$core" merge-base --is-ancestor "$core_upstream" HEAD
          git -C "$core" merge-base --is-ancestor "$core23" HEAD
          git -C "$core" diff --check "$core_upstream" HEAD

          test "$(git -C "$pb" rev-parse HEAD)" = "$pb_head"
          test "$(git -C "$pb" rev-parse "$pb_runtime^1")" = "$pb_upstream"
          test "$(git -C "$pb" rev-parse "$pb_runtime^2")" = "$pb15"
          git -C "$pb" merge-base --is-ancestor "$pb_runtime" HEAD
          git -C "$pb" merge-base --is-ancestor "$pb_upstream" HEAD
          git -C "$pb" merge-base --is-ancestor "$pb15" HEAD
          git -C "$pb" diff --name-only "$pb_runtime" HEAD | sort >/tmp/pb19-docs-actual
          printf '%s\n' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' \
            'docs/PB_UPSTREAM_RESTACK_CANDIDATE_2026-11-12.md' | sort >/tmp/pb19-docs-expected
          diff -u /tmp/pb19-docs-expected /tmp/pb19-docs-actual
          git -C "$pb" diff --check "$pb_upstream" HEAD

          test "$(git -C "$ip" rev-parse HEAD)" = "$ip168"
          test "$(git -C "$naxx" rev-parse HEAD)" = 51d0611476358286505aed3ca806ea250f644f66
          test "$(git -C "$wps" rev-parse HEAD)" = 36ad573c0ee22e24abf3f48b6e40c4bc360ec8e8
          test "$(git -C "$ab" rev-parse HEAD)" = 1d707cb61a0962ab01e4123681e2d3b66cc558a2
          test "$(git -C "$cs" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git -C "$cs" merge-base --is-ancestor "$services70" HEAD
          test "$(git -C "$cs" diff --name-only "$services70" HEAD)" = '.github/workflows/character-services-core25-pb19-ip168-wps-autobalance-native-20261112.yml'

          # Keep every distributed experimental/runtime option OFF.
          grep -Fqx 'CharacterServices.ExpansionUnlock.Enable = 0' "$cs/conf/character_services.conf.dist"
          grep -Fqx 'IndividualProgression.PaidExpansion.Enable = 0' "$ip/conf/individualProgression.conf.dist"
          for flag in PreserveVerifiedRandomBotStageOnLogin ProtectVerifiedRandomBotGroupFloor ForceVerifiedRandomBotTbcFloorOnLogin ExperimentalRndbotPlayerVisibility ExperimentalAttackLifecycleRegistry ProtectVerifiedRandomBotStageFloor; do
            grep -Fqx "IndividualProgression.F14.$flag = 0" "$ip/conf/individualProgression.conf.dist"
          done
          grep -Fqx 'Playerbots.F14TrackNewRandomBotBirth = 0' "$pb/conf/playerbots.conf.dist"
          grep -Fqx 'Playerbots.F14AuditNewBirthCommitReadback = 0' "$pb/conf/playerbots.conf.dist"
          grep -Fqx 'Playerbots.F14HoldTbcRaceRandomBotsDuringVanilla = 0' "$pb/conf/playerbots.conf.dist"
          grep -Fqx 'NaxxramasCore.MasterLootQuestGive.Enabled = 0' "$naxx/conf/mod_naxxramas_core.conf.dist"
          grep -Fqx 'NaxxramasCore.WarlockRitual.SecondStagePilot.Enabled = 0' "$naxx/conf/mod_naxxramas_core.conf.dist"

          # Current upstream population model must stay present; removed legacy
          # population knobs must not be resurrected by the PB restack.
          grep -Fq 'RandomBotCountMode' "$pb/src/PlayerbotAIConfig.cpp"
          grep -Fq 'RandomBotCountMinTime' "$pb/src/PlayerbotAIConfig.cpp"
          grep -Fq 'RandomBotCountMaxTime' "$pb/src/PlayerbotAIConfig.cpp"
          if grep -R -E 'EnablePeriodicOnlineOffline|PeriodicOnlineOfflineRatio|MinRandomBotInWorldTime|MaxRandomBotInWorldTime|PermanentlyInWorldTime'               "$pb/src/PlayerbotAIConfig.cpp" "$pb/src/PlayerbotAIConfig.h" "$pb/conf/playerbots.conf.dist"; then
            echo 'obsolete upstream population setting was reintroduced'
            exit 1
          fi

          # Inventory upstream SQL only. Never execute it here.
          git -C "$core" diff --name-only "$core23" HEAD -- data/sql > /tmp/core-upstream-sql
          test -s /tmp/core-upstream-sql
          printf '%s\n'             'data/sql/playerbots/updates/2026_10_06_00_ai_playerbot_craft_link_texts.sql'             'data/sql/playerbots/updates/2026_10_16_00_ai_playerbot_spanish_es-MX_texts.sql'             'data/sql/playerbots/updates/2026_10_22_00_ai_playerbot_calc_breakdown_text.sql'             'data/sql/playerbots/updates/2026_10_27_00_ai_playerbot_class_role_texts.sql' >/tmp/pb-upstream-sql
          while IFS= read -r sql; do test -f "$pb/$sql"; done </tmp/pb-upstream-sql
          echo "Core upstream SQL paths inventoried: $(wc -l </tmp/core-upstream-sql)"
          echo "Playerbots upstream SQL paths inventoried: $(wc -l </tmp/pb-upstream-sql)"

          python3 - <<'PY'
          from pathlib import Path
          s = Path('acore/modules/mod-world-party-scaling/src/WorldPartyScaling.cpp').read_text()
          nearby = s.split('uint32 GetNearbyGroupSize(Player* player, Creature* creature)',1)[1].split('// Mirrors KillRewarder',1)[0]
          assert 'CONFIG_GROUP_XP_DISTANCE' in nearby
          assert 'Group::GetFirstMember()' in nearby or 'group->GetFirstMember()' in nearby
          assert 'member->IsWithinDistInMap(creature, rewardDistance)' in nearby
          assert 'IsAlive()' not in nearby
          elig = s.split('bool IsCreatureEligible(Creature* creature, Player* engagingPlayer)',1)[1].split('float GetHealthRate',1)[0]
          for rank in ('CREATURE_ELITE_ELITE','CREATURE_ELITE_RAREELITE','CREATURE_ELITE_WORLDBOSS'):
              assert rank in elig
          block = elig.split('// Naxxramas: preserve native difficulty for open-world group content.',1)[1].split('if (creature->IsPet()',1)[0]
          assert 'CREATURE_ELITE_RARE' not in block.replace('CREATURE_ELITE_RAREELITE','')
          start = s.split('bool WorldPartyScalingMgr::TryStartScaling',1)[1].split('bool WorldPartyScalingMgr::FindOrStartState',1)[0]
          assert start.index('GetNearbyGroupSize(engagingPlayer, creature)') < start.index('_active.emplace(key, state)')
          find = s.split('bool WorldPartyScalingMgr::FindOrStartState',1)[1].split('void WorldPartyScalingMgr::OnCreatureEnterCombat',1)[0]
          assert find.index('FindState(key, out)') < find.index('TryStartScaling(creature, ResolvePlayer(target))')
          print('PASS merged WPS nearby-member + frozen-state + elite exclusion source contract')
          PY
          echo 'PASS exact Core/PB upstream-restack ancestry + IP168/Naxx292/WPS/public-AutoBalance tuple; all F14/Paid defaults remain OFF'
      - name: Run immutable Core/IP parents plus current restack regressions
        shell: bash
        run: |
          set -euo pipefail
          git -C acore worktree add --detach /tmp/core16 9e30516cccfe095f95948ceb0ac1d6ca265c54e4
          python3 /tmp/core16/tests/cosmic_f14_pass_source/test_f14_before_map_removal_source.py
          git -C acore worktree remove --force /tmp/core16
          git -C acore worktree add --detach /tmp/core17 34ad407467fcf6ea02fcce1595f7c0288966042f
          python3 /tmp/core17/tests/cosmic_f14_session_rebind/test_f14_session_rebind_source.py
          git -C acore worktree remove --force /tmp/core17
          git -C acore worktree add --detach /tmp/core18 4eea6bb6edc634ef4b4eefab71a27adba29e28db
          python3 /tmp/core18/tests/cosmic_f14_token_bound_out/test_f14_token_bound_out_source.py
          g++ -std=c++17 -Wall -Wextra -Werror -I/tmp/core18/src/server/game/Entities/Object/Updates             /tmp/core18/tests/cosmic_f14_token_bound_out/f14_initial_out_token_test.cpp -o /tmp/f14_initial_out_token_test
          /tmp/f14_initial_out_token_test
          git -C acore worktree remove --force /tmp/core18
          git -C acore worktree add --detach /tmp/core20 be46b96a0d2ab73ee22a946305b1308a02751ae9
          python3 /tmp/core20/tests/cosmic_f14_session_disconnect/test_f14_session_disconnect_source.py
          git -C acore worktree remove --force /tmp/core20
          git -C acore worktree add --detach /tmp/core21 991f2c86c928222d501a559a61434cfd15055dc8
          python3 /tmp/core21/tests/cosmic_f14_token_query_fail_visible/test_f14_token_query_fail_visible_source.py
          git -C acore worktree remove --force /tmp/core21
          # Core23's test includes an immutable exact changed-path contract, so replay
          # that historical contract on the exact Core23 head instead of a later
          # upstream-restacked descendant.
          git -C acore worktree add --detach /tmp/core23 dbb1dd5150f330d88522a10b85e93546fff72bad
          python3 /tmp/core23/tests/cosmic_f14_token_bound_create_current/test_f14_token_bound_create_current_source.py
          git -C acore worktree remove --force /tmp/core23

          # Separately prove the CURRENT Core25 restack still carries the semantic
          # token-bound CREATE/OUT fail-visible contract. This intentionally does
          # not assert Core23's historical eight-path diff scope.
          python3 - <<'PY'
          from pathlib import Path

          root = Path('acore')
          player = (root/'src/server/game/Entities/Player/PlayerUpdates.cpp').read_text()
          ud = (root/'src/server/game/Entities/Object/Updates/UpdateData.h').read_text()
          woc = (root/'src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp').read_text()
          woh = (root/'src/server/game/Scripting/ScriptDefines/WorldObjectScript.h').read_text()
          sm = (root/'src/server/game/Scripting/ScriptMgr.h').read_text()

          for needle in (
              'COSMIC_F14_TOKEN_BOUND_CREATURE_CREATE_QUERY_EXPERIMENT',
              'IsF14CreatureSuppressedFromClientViewForInitialCreate(',
              'data.F14MayAskInitialCreateQuery()',
              'data.F14InitialCreateQueryToken()',
              'ShouldF14SuppressCreatureInitialCreateForViewer(',
              'IsF14CreatureSuppressedFromClientViewForInitialOut(',
              'ShouldF14SuppressCreatureInitialOutForViewer(',
          ):
              assert needle in player, ('Core25 lost token-bound visibility contract', needle)

          batched = player.split('template <class T>\nvoid Player::UpdateVisibilityOf(T* target, UpdateData& data',1)[1].split('void Player::GetInitialVisiblePackets',1)[0]
          assert 'IsF14CreatureSuppressedFromClientViewForInitialCreate(' in batched
          assert 'data.F14MayAskInitialCreateQuery()' in batched
          create_macro = batched.split('#if defined(COSMIC_F14_TOKEN_BOUND_CREATURE_CREATE_QUERY_EXPERIMENT)',1)[1].split('#else',1)[0]
          assert 'IsF14CreatureSuppressedFromClientView(this, target)' not in create_macro

          direct = player.split('void Player::UpdateVisibilityOf(WorldObject* target)',1)[1]
          assert 'IsF14CreatureSuppressedFromClientViewForInitialCreate(' not in direct
          assert 'F14InitialCreateQueryToken' not in direct

          assert 'F14MayAskInitialCreateQuery() const' in ud
          token_piece = ud.split('F14InitialCreateQueryToken() const',1)[1].split('#endif',1)[0]
          assert '_f14InitialOutAdmission.Token()' in token_piece

          for text, needle in (
              (woh, 'WORLDOBJECTHOOK_ON_F14_VIEWER_CREATURE_INITIAL_CREATE_TOKEN_QUERY'),
              (woh, 'OnF14ShouldSuppressCreatureInitialCreateForViewer'),
              (woc, 'WORLDOBJECTHOOK_ON_F14_VIEWER_CREATURE_INITIAL_CREATE_TOKEN_QUERY'),
              (sm, 'ShouldF14SuppressCreatureInitialCreateForViewer'),
          ):
              assert needle in text, ('Core25 CREATE script ABI missing', needle)

          for name, marker in (
              ('OUT', 'bool ScriptMgr::ShouldF14SuppressCreatureInitialOutForViewer('),
              ('CREATE', 'bool ScriptMgr::ShouldF14SuppressCreatureInitialCreateForViewer('),
          ):
              fn = woc.split(marker,1)[1].split('#endif',1)[0]
              assert 'if (!viewer || !creature || !token)' in fn, name
              assert 'return false;' in fn, name
              assert 'ASSERT(viewer && creature && token)' not in fn, name
              assert 'CALL_ENABLED_BOOLEAN_HOOKS_WITH_DEFAULT_FALSE' in fn, name

          print('PASS Core25 current token-bound CREATE/OUT semantic contract remains default-FALSE and fail-visible')
          PY

          g++ -std=c++17 -Wall -Wextra -Werror -Iacore/src/server/game/Entities/Object/Updates \
            acore/tests/cosmic_f14_token_bound_out/f14_initial_out_token_test.cpp -o /tmp/f14_core25_visibility_pass_token_test
          /tmp/f14_core25_visibility_pass_token_test
          ip=acore/modules/mod-individual-progression
          git -C "$ip" worktree add --detach /tmp/ip158 d72cb188ce763181b43ceced79fdae9c69b88829
          python3 /tmp/ip158/tests/test_f14_session_rebind_observer_source.py
          git -C "$ip" worktree remove --force /tmp/ip158
          git -C "$ip" worktree add --detach /tmp/ip159 013a2e0e63e41bbd7b21ddf31c6fa4f6fc8ea554
          python3 /tmp/ip159/tests/test_f14_current_pass_identity_source.py
          git -C "$ip" worktree remove --force /tmp/ip159
          git -C "$ip" worktree add --detach /tmp/ip160 390040f57551e16ec016c12058c10c9c229922a7
          python3 /tmp/ip160/tests/test_f14_token_bound_initial_out_observer_source.py
          git -C "$ip" worktree remove --force /tmp/ip160
          git -C "$ip" worktree add --detach /tmp/ip161 cfed841d56f7a528112c665079cea18266b0a4a0
          python3 /tmp/ip161/tests/test_f14_combat_script_name_collision_source.py
          git -C "$ip" worktree remove --force /tmp/ip161
          git -C "$ip" worktree add --detach /tmp/ip163 efe91f3fbd9b12643e903bbbf25f9b59e8c2b624
          python3 /tmp/ip163/tests/test_f14_combat_slot_release_source.py
          git -C "$ip" worktree remove --force /tmp/ip163
          git -C "$ip" worktree add --detach /tmp/ip164 2b46cc76a23d97a0de66274b4a496a30a57c810f
          python3 /tmp/ip164/tests/test_f14_current_rights_refresh_source.py
          git -C "$ip" worktree remove --force /tmp/ip164
          git -C "$ip" worktree add --detach /tmp/ip165 246b638161d10be74e2a9b9046c04c68850b4bdf
          python3 /tmp/ip165/tests/test_f14_session_disconnect_observer_source.py
          git -C "$ip" worktree remove --force /tmp/ip165
          git -C "$ip" worktree add --detach /tmp/ip166 d3aea3c9612041b05ff7a669fa7906791b5ad7ae
          python3 /tmp/ip166/tests/test_f14_pass_end_invalid_cleanup_source.py
          git -C "$ip" worktree remove --force /tmp/ip166
          git -C "$ip" worktree add --detach /tmp/ip167 b4a0ee2a6adf1a6ee391d2226f70fa1bc72136bd
          python3 /tmp/ip167/tests/test_f14_combat_session_release_source.py
          git -C "$ip" worktree remove --force /tmp/ip167
          python3 "$ip/tests/test_f14_rights_refresh_performance_source.py"
          git -C "$ip" worktree add --detach /tmp/ip155 bd4033b3bc40a142a6096f641677d972f0b06814
          python3 /tmp/ip155/tests/test_f14_departure_storage_bridge_source.py
          git -C "$ip" worktree remove --force /tmp/ip155
          for mode in normal ndebug; do
            extra=()
            if [ "$mode" = ndebug ]; then extra+=(-DNDEBUG); fi
            for test in f14_current_rights_refresh_test f14_current_pass_identity_test f14_current_combat_ownership_test f14_reservation_gate_test f14_owned_restore_shards_test f14_current_viewer_session_test f14_departure_storage_bridge_test; do
              g++ -std=c++17 -Wall -Wextra -Werror -pthread "${extra[@]}" -I"$ip/src" "$ip/tests/$test.cpp" -o "/tmp/$test"
              "/tmp/$test"
            done
          done
          g++ -std=c++17 -Wall -Wextra -Werror -c "$ip/src/IndividualProgressionF14CurrentCoreLifecycle.cpp" -o /tmp/current-off.o
          pb=acore/modules/mod-playerbots
          python3 -B "$pb/tests/test_f14_upstream_population_restack_source.py" -v
          for compiler in g++ clang++; do
            for mode in normal ndebug; do
              extra=()
              if [ "$mode" = ndebug ]; then extra+=(-DNDEBUG); fi
              "$compiler" -std=c++20 -Wall -Wextra -Werror -pedantic -O2 "${extra[@]}"                 "$pb/tests/f14_upstream_population_restack_model.cpp" -o /tmp/pb-f14-upstream-restack
              /tmp/pb-f14-upstream-restack
              "$compiler" -std=c++20 -Wall -Wextra -Werror -pedantic -O2 "${extra[@]}"                 "$pb/tests/f14_vanilla_tbc_rndbot_population_hold.cpp" -o /tmp/pb-f14-hold
              /tmp/pb-f14-hold
              "$compiler" -std=c++20 -Wall -Wextra -Werror -pedantic -O2 "${extra[@]}"                 "$pb/tests/f14_pending_rndbot_login_hold.cpp" -o /tmp/pb-f14-pending
              /tmp/pb-f14-pending
            done
          done
      - name: Install compile dependencies on disposable runner only
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git cmake ninja-build g++ make pkg-config file libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev libncurses-dev libboost-all-dev
      - name: Generate combined graph with Core25 + PB19 + IP168 + WPS + public AutoBalance
        run: |
          cmake -S acore -B acore-build -G Ninja             -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON             -DCMAKE_CXX_FLAGS="-DCOSMIC_IP_F14_REQUIRE_PLAYERBOTS -DCOSMIC_IP_F14_CORE6_ACTOR_WHO_NEGATIVE_ADAPTER_EXPERIMENT=1 -DCOSMIC_F14_NOTIFIER_PASS_LIFECYCLE_EXPERIMENT=1 -DCOSMIC_F14_CREATURE_BATCH_GUID_EVIDENCE_EXPERIMENT=1 -DCOSMIC_F14_PRE_SEND_CREATURE_OUT_EVIDENCE_EXPERIMENT=1 -DCOSMIC_IP_F14_VERIFIED_ACTOR_PUBLICATION_EXPERIMENT=1 -DCOSMIC_IP_F14_CORE6_POSITIVE_RNDBOT_VIEWER_POLICY_EXPERIMENT=1 -DCOSMIC_F14_PLAYER_CLIENT_VIEWER_QUERY_EXPERIMENT=1 -DCOSMIC_F14_WHO_GUID_QUERY_EXPERIMENT=1 -DCOSMIC_F14_CREATURE_CLIENT_VIEWER_QUERY_EXPERIMENT=1 -DCOSMIC_F14_PRE_MAP_REMOVAL_EXPERIMENT=1 -DCOSMIC_IP_F14_CURRENT_CORE_LIFECYCLE_OBSERVER_EXPERIMENT=1 -DCOSMIC_IP_F14_CURRENT_COMBAT_OWNERSHIP_EXPERIMENT=1 -DCOSMIC_F14_SESSION_REBIND_EXPERIMENT=1 -DCOSMIC_IP_F14_SESSION_REBIND_OBSERVER_EXPERIMENT=1 -DCOSMIC_IP_F14_CURRENT_PASS_IDENTITY_EXPERIMENT=1 -DCOSMIC_F14_TOKEN_BOUND_CREATURE_OUT_QUERY_EXPERIMENT=1 -DCOSMIC_F14_TOKEN_BOUND_CREATURE_CREATE_QUERY_EXPERIMENT=1 -DCOSMIC_IP_F14_TOKEN_BOUND_INITIAL_OUT_OBSERVER_EXPERIMENT=1 -DCOSMIC_IP_F14_CURRENT_RIGHTS_REFRESH_EXPERIMENT=1 -DCOSMIC_F14_SESSION_DISCONNECT_EXPERIMENT=1 -DCOSMIC_IP_F14_SESSION_DISCONNECT_OBSERVER_EXPERIMENT=1"             -DMODULES=static -DSCRIPTS=static -DAPPS_BUILD=world-only -DTOOLS_BUILD=none -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
      - name: Prove Core25/PB19/IP168 observer macros across combined compile commands
        shell: bash
        run: |
          python3 - <<'PY'
          import json, shlex
          from pathlib import Path
          entries = json.loads(Path('acore-build/compile_commands.json').read_text())
          required = (
            'COSMIC_F14_NOTIFIER_PASS_LIFECYCLE_EXPERIMENT',
            'COSMIC_F14_CREATURE_BATCH_GUID_EVIDENCE_EXPERIMENT',
            'COSMIC_F14_PRE_SEND_CREATURE_OUT_EVIDENCE_EXPERIMENT',
            'COSMIC_F14_CREATURE_CLIENT_VIEWER_QUERY_EXPERIMENT',
            'COSMIC_F14_PLAYER_CLIENT_VIEWER_QUERY_EXPERIMENT',
            'COSMIC_F14_WHO_GUID_QUERY_EXPERIMENT',
            'COSMIC_F14_PRE_MAP_REMOVAL_EXPERIMENT',
            'COSMIC_IP_F14_VERIFIED_ACTOR_PUBLICATION_EXPERIMENT',
            'COSMIC_IP_F14_CURRENT_CORE_LIFECYCLE_OBSERVER_EXPERIMENT',
            'COSMIC_IP_F14_CURRENT_COMBAT_OWNERSHIP_EXPERIMENT',
            'COSMIC_F14_SESSION_REBIND_EXPERIMENT',
            'COSMIC_IP_F14_SESSION_REBIND_OBSERVER_EXPERIMENT',
            'COSMIC_IP_F14_CURRENT_PASS_IDENTITY_EXPERIMENT',
            'COSMIC_F14_TOKEN_BOUND_CREATURE_OUT_QUERY_EXPERIMENT',
            'COSMIC_F14_TOKEN_BOUND_CREATURE_CREATE_QUERY_EXPERIMENT',
            'COSMIC_IP_F14_TOKEN_BOUND_INITIAL_OUT_OBSERVER_EXPERIMENT',
            'COSMIC_IP_F14_CURRENT_RIGHTS_REFRESH_EXPERIMENT',
            'COSMIC_F14_SESSION_DISCONNECT_EXPERIMENT',
            'COSMIC_IP_F14_SESSION_DISCONNECT_OBSERVER_EXPERIMENT',
          )
          targets = {
            '/src/server/game/Maps/Map.cpp',
            '/src/server/game/Handlers/CharacterHandler.cpp',
            '/src/server/game/Server/WorldSession.cpp',
            '/src/server/game/Entities/Player/PlayerUpdates.cpp',
            '/src/server/game/Scripting/ScriptDefines/AllMapScript.cpp',
            '/src/server/game/Scripting/ScriptDefines/PlayerScript.cpp',
            '/src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp',
            '/mod-individual-progression/src/IndividualProgressionF14CurrentCoreLifecycle.cpp',
            '/mod-individual-progression/src/IndividualProgressionF14LifecycleScript.cpp',
            '/mod-playerbots/src/Bot/PlayerbotMgr.cpp',
            '/mod-character-services/src/CharacterServices.cpp',
            '/mod-naxxramas-core/src/Systems/MasterLootQuestGive.cpp',
            '/mod-world-party-scaling/src/WorldPartyScaling.cpp',
          }
          seen = set()
          count = 0
          for entry in entries:
            src = entry['file'].replace('\\', '/')
            if not src.endswith('.cpp') or not ('/acore/src/' in src or '/acore/modules/' in src):
              continue
            argv = entry.get('arguments') or shlex.split(entry['command'])
            for macro in required:
              defs = [a for a in argv if a == '-D'+macro or a.startswith('-D'+macro+'=')]
              assert defs == ['-D'+macro+'=1'] and '-U'+macro not in argv, (src, macro, defs)
            assert not any(a.startswith('-DCOSMIC_IP_F14_TAGGED_GUID_OBSERVER_EXPERIMENT') for a in argv), src
            seen.update(t for t in targets if src.endswith(t))
            count += 1
          assert seen == targets, ('missing actual compile units', targets-seen)
          assert count > 0
          print('PASS uniform Core25/PB19/IP168/WPS/AutoBalance observer ABI across', count, 'C++ translation units')
          PY
      - name: Compile AND link actual Worldserver (NO SERVER START)
        run: cmake --build acore-build --target worldserver --parallel 2
      - name: Verify resulting binary without running it
        run: |
          test -s acore-build/src/server/apps/worldserver
          test -x acore-build/src/server/apps/worldserver
          echo 'PASS Core25/PB19/IP168/Naxx292/Services/WPS/public-AutoBalance native link; no gameplay or deployment evidence'
      - name: Safety boundary
        if: always()
        run: |
          echo 'No live server, SQL, config, database, account, client or packet operation. Core25 + PB19 + IP168 + merged WPS + public AutoBalance compile enabled only in disposable runner; IP160 callback remains hard-forced FALSE, F14/Paid settings OFF. Installed owner AutoBalance revision remains unverified; Services69 remains independent.'
