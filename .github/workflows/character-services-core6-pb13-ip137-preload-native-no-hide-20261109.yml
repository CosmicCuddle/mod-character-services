          grep -Fq 'CharacterDatabase.AsyncCommitTransaction(birthTrans)' "$pb/src/Bot/Factory/RandomPlayerbotFactory.cpp"
          grep -Fq 'SELECT COUNT(*) FROM character_settings WHERE guid = {}' "$pb/src/Bot/Factory/RandomPlayerbotFactory.cpp"
          grep -Fq 'SELECT COUNT(*) FROM character_queststatus_rewarded WHERE guid = {}' "$pb/src/Bot/Factory/RandomPlayerbotFactory.cpp"
          grep -Fq 'SELECT COUNT(*) FROM character_queststatus WHERE guid = {}' "$pb/src/Bot/Factory/RandomPlayerbotFactory.cpp"
