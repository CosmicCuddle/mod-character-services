        shell: bash
        run: |
          set -euo pipefail
          core=acore
          test "$(git -C "$core" rev-parse HEAD)" = 6a0c1dba53617c77353718eb4338fda634fca5eb
          grep -Fq 'bool ShouldF14SuppressCreatureForViewer(' "$core/src/server/game/Scripting/ScriptMgr.h"
